name: Linux

# Builds Linux inside OpenSBI with scripts/build-linux.sh and boots it on the
# emulator. Every push boots the quick hello image; a v* tag (or a manual
# run) also builds the Alpine image and attaches it to the release.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hello:
    name: boot Linux (hello)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-riscv64-linux-gnu flex bison bc

      - name: Build the emulator
        run: |
          cmake --preset rv64-release -DRISCV_TESTS=OFF
          cmake --build --preset rv64-release --target riscv

      - name: Build Linux
        run: scripts/build-linux.sh hello

      - name: Boot
        shell: bash
        run: |
          timeout 300 build/rv64-release/riscv build/linux-hello/fw_payload.elf | tee boot.log
          grep -q "Hello from user space" boot.log

  alpine:
    name: boot Linux (alpine)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-riscv64-linux-gnu flex bison bc

      - name: Build the emulator
        run: |
          cmake --preset rv64-release -DRISCV_TESTS=OFF
          cmake --build --preset rv64-release --target riscv

      - name: Build Linux
        run: scripts/build-linux.sh alpine

      # The board does not power off on its own here: wait up to five
      # minutes for the login prompt, then stop it.
      - name: Boot
        shell: bash
        run: |
          build/rv64-release/riscv build/linux-alpine/fw_payload.elf \
            < /dev/null > boot.log &
          for i in $(seq 300); do
            grep -q "riscv-on-c login:" boot.log && break
            sleep 1
          done
          kill $! || true
          cat boot.log
          grep -q "riscv-on-c login:" boot.log

      # The image holds GPL software (Linux, busybox and more). The kernel
      # source and configuration ship with it; Alpine's packages are
      # unmodified, so the list of them with their versions and licenses
      # points at Alpine's own sources.
      - name: Collect sources and licenses
        run: |
          work=build/linux-alpine
          version=$(sed -n 's/^ALPINE_VERSION=//p' scripts/build-linux.sh)
          mkdir -p legal-info/linux legal-info/opensbi legal-info/alpine
          cp $work/linux-*.tar.xz $work/linux.config legal-info/linux/
          cp $work/opensbi/COPYING.BSD legal-info/opensbi/
          git -C $work/opensbi describe --tags > legal-info/opensbi/VERSION
          {
            echo "Alpine Linux $version mini root filesystem: unmodified packages;"
            echo "scripts/build-linux.sh rewrites /etc/inittab, /etc/hostname and"
            echo "root's password field in /etc/shadow."
            echo "Sources: https://gitlab.alpinelinux.org/alpine/aports/-/tree/v$version"
            echo
            awk -F: '/^P:/ { p = $2 } /^V:/ { v = $2 } /^L:/ { print p, v, $2 }' \
              $work/rootfs/lib/apk/db/installed
          } > legal-info/alpine/PACKAGES
          tar czf legal-info.tar.gz legal-info
          cp $work/fw_payload.elf alpine.elf

      - uses: actions/upload-artifact@v4
        with:
          name: riscv-on-c-linux-alpine
          path: |
            build/rv64-release/riscv
            alpine.elf
            build/linux-alpine/linux.config
            legal-info.tar.gz
            boot.log

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/rv64-release/riscv
            alpine.elf
            build/linux-alpine/linux.config
            legal-info.tar.gz
